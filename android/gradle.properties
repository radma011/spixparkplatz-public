# Project-wide Gradle settings.
# This file is committed and uploaded to EAS Build.
# Local-only overrides (JDK path, keystore passwords) go in:
#   - ~/.gradle/gradle.properties  (e.g. org.gradle.java.home)
#   - android/keystore.properties  (release signing; gitignored)

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX package structure
android.useAndroidX=true

# Architectures to build
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture (Fabric / TurboModules)
newArchEnabled=true

# Hermes JS engine
hermesEnabled=true

# Edge-to-edge display
edgeToEdgeEnabled=false
